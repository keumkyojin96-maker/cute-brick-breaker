<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>말랑 벽돌깨기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffe4f1; --bg2: #e3f0ff; --ink: #6b4a7a; --accent: #ff8fb8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Jua', system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  h1 { margin: 8px 0 4px; font-size: clamp(22px, 5vw, 34px); letter-spacing: 1px; text-shadow: 0 3px 0 #fff; }
  .wrap { position: relative; width: min(96vw, 520px); }
  canvas {
    width: 100%; display: block; border-radius: 24px;
    background: #fffaf3; box-shadow: 0 10px 0 #f3c7da, 0 18px 40px rgba(180, 120, 160, .25);
    border: 4px solid #fff;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center;
    border-radius: 24px; background: rgba(255, 250, 243, .82); backdrop-filter: blur(3px);
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: clamp(30px, 8vw, 46px); }
  .overlay p { margin: 0; font-size: 18px; line-height: 1.5; }
  button {
    font-family: inherit; font-size: 22px; color: #fff; cursor: pointer;
    background: var(--accent); border: none; border-radius: 999px; padding: 12px 34px;
    box-shadow: 0 6px 0 #e0648f; transition: transform .1s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #e0648f; }
  .hint { margin: 10px 0; font-size: 15px; opacity: .75; }
</style>
</head>
<body>
<h1>🍓 말랑 벽돌깨기 🍓</h1>
<div class="wrap">
  <canvas id="c" width="480" height="640"></canvas>
  <div class="overlay" id="overlay">
    <div class="big" id="ovTitle">🐱 준비됐냥?</div>
    <p id="ovText">젤리 벽돌을 모두 깨주세요!<br>⭐ 별을 받으면 공이 늘어나요</p>
    <button id="startBtn">시작하기</button>
  </div>
</div>
<div class="hint">마우스 / 터치로 패들 이동 · ← → 키 · 스페이스로 발사</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');

  const COLORS = ['#ffadc9', '#ffd59e', '#fff1a1', '#b9f2c4', '#a8e0ff', '#d4c1ff'];
  const DARK = ['#f27fa7', '#f5b56b', '#efd96a', '#7fd897', '#6fc3f0', '#ab90f5'];
  const LAYOUTS = [
    ['..XXXXXX..', '.XXXXXXXX.', 'XXXXXXXXXX', 'XXXXXXXXXX', '.XXXXXXXX.'],
    ['X.X.X.X.X.', '.X.X.X.X.X', 'XXXXXXXXXX', 'X.X.X.X.X.', '.X.X.X.X.X', 'XXXXXXXXXX'],
    ['.XX....XX.', 'XXXX..XXXX', 'XXXXXXXXXX', 'XXXXXXXXXX', '.XXXXXXXX.', '..XXXXXX..', '...XXXX...', '....XX....'],
    ['XXXXXXXXXX', 'X22222222X', 'X2XXXXXX2X', 'X2X2222X2X', 'X2XXXXXX2X', 'X22222222X', 'XXXXXXXXXX'],
  ];

  let state = 'menu', level = 0, score = 0, lives = 3;
  let paddle, balls, bricks, particles, stars, floaters, t = 0, shake = 0;
  const keys = {};

  // ---------- sound ----------
  let ac;
  function beep(freq, dur = 0.08, type = 'sine', vol = 0.12) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      o.frequency.exponentialRampToValueAtTime(freq * 1.5, ac.currentTime + dur);
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  // ---------- setup ----------
  function newBall(x, y, vx, vy, stuck) {
    return { x, y, vx, vy, r: 9, stuck, trail: [] };
  }
  function resetPaddle() {
    paddle = { x: W / 2, y: H - 50, w: 96, h: 18, tx: W / 2, squish: 0 };
    balls = [newBall(W / 2, paddle.y - 20, 0, 0, true)];
  }
  function loadLevel() {
    const lay = LAYOUTS[level % LAYOUTS.length];
    const cols = 10, gap = 6, bw = (W - 30 - gap * (cols - 1)) / cols, bh = 24;
    bricks = [];
    lay.forEach((row, r) => {
      [...row].forEach((ch, c) => {
        if (ch === '.') return;
        const hp = ch === '2' ? 2 : 1 + (level >= 4 && r < 2 ? 1 : 0);
        bricks.push({
          x: 15 + c * (bw + gap), y: 70 + r * (bh + gap), w: bw, h: bh,
          color: r % COLORS.length, hp, maxHp: hp, wob: 0, face: Math.random() * 3 | 0,
        });
      });
    });
    particles = []; stars = []; floaters = [];
    resetPaddle();
  }

  function startGame() {
    level = 0; score = 0; lives = 3;
    loadLevel();
    state = 'play';
    overlay.classList.add('hidden');
  }
  function showOverlay(title, text, btn) {
    ovTitle.innerHTML = title; ovText.innerHTML = text; startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }
  startBtn.onclick = () => {
    if (state === 'clear') {
      level++; loadLevel(); state = 'play'; overlay.classList.add('hidden');
    } else startGame();
  };

  // ---------- input ----------
  function pointerX(e) {
    const rect = cv.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX);
    return (cx - rect.left) * (W / rect.width);
  }
  window.addEventListener('mousemove', e => { if (paddle) paddle.tx = pointerX(e); });
  cv.addEventListener('touchmove', e => { e.preventDefault(); paddle.tx = pointerX(e); }, { passive: false });
  cv.addEventListener('touchstart', e => { e.preventDefault(); if (paddle) paddle.tx = pointerX(e); launch(); }, { passive: false });
  cv.addEventListener('mousedown', launch);
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); launch(); }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function launch() {
    if (state !== 'play') return;
    balls.forEach(b => {
      if (b.stuck) {
        b.stuck = false;
        const sp = speed();
        b.vx = (Math.random() - 0.5) * sp; b.vy = -sp;
        beep(520, 0.1, 'triangle');
      }
    });
  }
  const speed = () => 5.2 + level * 0.45;

  // ---------- effects ----------
  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1, color,
        heart: Math.random() < 0.35, size: 3 + Math.random() * 4 });
    }
  }
  function floatText(x, y, text) { floaters.push({ x, y, text, life: 1 }); }

  // ---------- update ----------
  function update() {
    t++;
    if (keys['ArrowLeft']) paddle.tx -= 9;
    if (keys['ArrowRight']) paddle.tx += 9;
    paddle.tx = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.tx));
    paddle.x += (paddle.tx - paddle.x) * 0.35;
    paddle.squish *= 0.85;

    for (const b of balls) {
      if (b.stuck) { b.x = paddle.x; b.y = paddle.y - paddle.h / 2 - b.r; continue; }
      b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 8) b.trail.shift();
      // substeps for stable collisions
      const steps = 3;
      for (let s = 0; s < steps; s++) {
        b.x += b.vx / steps; b.y += b.vy / steps;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); beep(330, 0.04); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(330, 0.04); }
        if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); beep(330, 0.04); }

        // paddle
        const px = paddle.x - paddle.w / 2, py = paddle.y - paddle.h / 2;
        if (b.vy > 0 && b.y + b.r > py && b.y - b.r < py + paddle.h && b.x > px - b.r && b.x < px + paddle.w + b.r) {
          const hit = (b.x - paddle.x) / (paddle.w / 2);
          const ang = hit * 1.05;
          const sp = speed();
          b.vx = Math.sin(ang) * sp; b.vy = -Math.cos(ang) * sp;
          b.y = py - b.r;
          paddle.squish = 1;
          beep(440, 0.07, 'triangle');
        }

        // bricks
        for (const br of bricks) {
          if (br.hp <= 0) continue;
          const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
          const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
          const dx = b.x - cx, dy = b.y - cy;
          if (dx * dx + dy * dy < b.r * b.r) {
            const ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
            const oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
            if (ox < oy) { b.vx = -b.vx; b.x += b.vx > 0 ? ox : -ox; }
            else { b.vy = -b.vy; b.y += b.vy > 0 ? oy : -oy; }
            hitBrick(br);
            break;
          }
        }
      }
    }

    // ball lost
    balls = balls.filter(b => b.y < H + 30);
    if (balls.length === 0) {
      lives--; shake = 14; beep(180, 0.3, 'sawtooth', 0.08);
      if (lives <= 0) {
        state = 'over';
        showOverlay('😿 아쉬워요...', `점수: <b>${score}</b><br>다시 도전해볼까요?`, '다시 하기');
      } else resetPaddle();
    }

    // stars (power-up)
    for (const s of stars) {
      s.y += 2.4; s.rot += 0.08;
      if (Math.abs(s.x - paddle.x) < paddle.w / 2 + 10 && Math.abs(s.y - paddle.y) < 18) {
        s.dead = true;
        const src = balls.find(b => !b.stuck) || balls[0];
        for (let i = 0; i < 2; i++) {
          const a = -Math.PI / 2 + (i ? 0.5 : -0.5);
          balls.push(newBall(src.x, src.y, Math.cos(a) * speed(), Math.sin(a) * speed(), false));
        }
        floatText(s.x, s.y - 10, '공 x3!');
        beep(880, 0.15, 'triangle'); beep(1320, 0.2, 'sine');
      }
      if (s.y > H + 20) s.dead = true;
    }
    stars = stars.filter(s => !s.dead);

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.022; }
    particles = particles.filter(p => p.life > 0);
    for (const f of floaters) { f.y -= 0.8; f.life -= 0.018; }
    floaters = floaters.filter(f => f.life > 0);
    for (const br of bricks) br.wob *= 0.88;
    shake *= 0.85;

    if (bricks.every(b => b.hp <= 0)) {
      state = 'clear';
      score += lives * 100;
      beep(660, 0.12); setTimeout(() => beep(880, 0.12), 120); setTimeout(() => beep(1100, 0.2), 240);
      showOverlay('🎉 스테이지 클리어!', `점수: <b>${score}</b> (목숨 보너스 +${lives * 100})`, '다음 스테이지');
    }
  }

  function hitBrick(br) {
    br.hp--; br.wob = 1;
    if (br.hp <= 0) {
      score += 10 * (level + 1);
      burst(br.x + br.w / 2, br.y + br.h / 2, COLORS[br.color]);
      floatText(br.x + br.w / 2, br.y, '+' + 10 * (level + 1));
      beep(600 + Math.random() * 400, 0.08, 'square', 0.05);
      if (Math.random() < 0.12) stars.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, rot: 0 });
    } else {
      beep(300, 0.06, 'square', 0.05);
    }
  }

  // ---------- draw ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawHeart(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.35);
    ctx.bezierCurveTo(x - s, y + s * 0.8, x, y + s, x, y + s * 1.25);
    ctx.bezierCurveTo(x, y + s, x + s, y + s * 0.8, x + s, y + s * 0.35);
    ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
    ctx.fill();
  }
  function drawStar(x, y, r, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r, a = i * Math.PI / 5 - Math.PI / 2;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffd84d'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#f5a623'; ctx.stroke();
    ctx.fillStyle = '#6b4a7a';
    ctx.beginPath(); ctx.arc(-3, -1, 1.6, 0, 7); ctx.arc(3, -1, 1.6, 0, 7); ctx.fill();
    ctx.restore();
  }
  function drawFace(cx, cy, kind, scale = 1, hurt = false) {
    ctx.fillStyle = '#6b4a7a'; ctx.strokeStyle = '#6b4a7a'; ctx.lineWidth = 1.8 * scale;
    const ex = 6 * scale, blink = (t + cx * 7) % 220 < 8;
    if (hurt) {
      ctx.beginPath();
      ctx.moveTo(cx - ex - 2, cy - 4); ctx.lineTo(cx - ex + 2, cy - 1); ctx.lineTo(cx - ex - 2, cy + 1);
      ctx.moveTo(cx + ex + 2, cy - 4); ctx.lineTo(cx + ex - 2, cy - 1); ctx.lineTo(cx + ex + 2, cy + 1);
      ctx.stroke();
    } else if (blink || kind === 2) {
      ctx.beginPath();
      ctx.arc(cx - ex, cy - 1, 2.4 * scale, Math.PI, 0); ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx + ex, cy - 1, 2.4 * scale, Math.PI, 0); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(cx - ex, cy - 2, 2.2 * scale, 0, 7); ctx.arc(cx + ex, cy - 2, 2.2 * scale, 0, 7); ctx.fill();
    }
    ctx.beginPath();
    if (kind === 1) ctx.arc(cx, cy + 2, 2 * scale, 0, 7);
    else ctx.arc(cx, cy + 1, 2.6 * scale, 0.15 * Math.PI, 0.85 * Math.PI);
    kind === 1 ? ctx.stroke() : ctx.stroke();
    ctx.fillStyle = 'rgba(255,120,150,.45)';
    ctx.beginPath();
    ctx.ellipse(cx - ex - 4 * scale, cy + 3, 3 * scale, 2 * scale, 0, 0, 7);
    ctx.ellipse(cx + ex + 4 * scale, cy + 3, 3 * scale, 2 * scale, 0, 0, 7);
    ctx.fill();
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // polka dots
    ctx.fillStyle = 'rgba(255, 182, 210, .18)';
    for (let y = 0; y < H; y += 40) for (let x = (y / 40 % 2) * 20; x < W; x += 40) {
      ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    }

    // HUD
    ctx.fillStyle = '#6b4a7a'; ctx.font = '22px Jua, sans-serif'; ctx.textBaseline = 'middle';
    ctx.textAlign = 'left'; ctx.fillText('점수 ' + score, 18, 32);
    ctx.textAlign = 'center'; ctx.fillText('STAGE ' + (level + 1), W / 2, 32);
    for (let i = 0; i < 3; i++) drawHeart(W - 30 - i * 28, 22, 10, i < lives ? '#ff7aa8' : '#f1dbe6');

    // bricks
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      const s = 1 + Math.sin(t * 0.5) * 0.08 * br.wob;
      const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
      ctx.save(); ctx.translate(cx, cy); ctx.scale(s, 2 - s); ctx.translate(-cx, -cy);
      ctx.fillStyle = DARK[br.color];
      roundRect(br.x, br.y + 3, br.w, br.h, 9); ctx.fill();
      ctx.fillStyle = COLORS[br.color];
      roundRect(br.x, br.y, br.w, br.h, 9); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      roundRect(br.x + 5, br.y + 3, br.w * 0.35, 4, 2); ctx.fill();
      if (br.maxHp > 1 && br.hp > 1) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.setLineDash([4, 3]);
        roundRect(br.x + 2, br.y + 2, br.w - 4, br.h - 4, 7); ctx.stroke(); ctx.setLineDash([]);
      }
      drawFace(cx, cy + 1, br.face, 0.75, br.wob > 0.3 || br.hp < br.maxHp);
      ctx.restore();
    }

    // stars
    stars.forEach(s => drawStar(s.x, s.y, 13, Math.sin(s.rot) * 0.4));

    // paddle (cat)
    const pw = paddle.w * (1 + paddle.squish * 0.12), ph = paddle.h * (1 - paddle.squish * 0.25);
    const px = paddle.x - pw / 2, py = paddle.y - ph / 2;
    ctx.fillStyle = '#ffc2d6';
    ctx.beginPath(); // ears
    ctx.moveTo(px + 12, py + 2); ctx.lineTo(px + 20, py - 12); ctx.lineTo(px + 30, py + 2);
    ctx.moveTo(px + pw - 12, py + 2); ctx.lineTo(px + pw - 20, py - 12); ctx.lineTo(px + pw - 30, py + 2);
    ctx.fill();
    ctx.fillStyle = '#f095b5'; roundRect(px, py + 3, pw, ph, ph / 2); ctx.fill();
    ctx.fillStyle = '#ffc2d6'; roundRect(px, py, pw, ph, ph / 2); ctx.fill();
    drawFace(paddle.x, paddle.y + 1, 0, 0.9);
    // whiskers
    ctx.strokeStyle = '#c47a99'; ctx.lineWidth = 1.2; ctx.beginPath();
    ctx.moveTo(px + 6, paddle.y); ctx.lineTo(px - 8, paddle.y - 3);
    ctx.moveTo(px + 6, paddle.y + 4); ctx.lineTo(px - 8, paddle.y + 6);
    ctx.moveTo(px + pw - 6, paddle.y); ctx.lineTo(px + pw + 8, paddle.y - 3);
    ctx.moveTo(px + pw - 6, paddle.y + 4); ctx.lineTo(px + pw + 8, paddle.y + 6);
    ctx.stroke();

    // balls
    for (const b of balls) {
      b.trail.forEach((p, i) => {
        ctx.fillStyle = `rgba(255, 170, 200, ${i / b.trail.length * 0.4})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, b.r * (i / b.trail.length), 0, 7); ctx.fill();
      });
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#ff8fb8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#6b4a7a';
      ctx.beginPath(); ctx.arc(b.x - 3, b.y - 1, 1.4, 0, 7); ctx.arc(b.x + 3, b.y - 1, 1.4, 0, 7); ctx.fill();
    }
    if (state === 'play' && balls.some(b => b.stuck)) {
      ctx.fillStyle = 'rgba(107, 74, 122, ' + (0.5 + Math.sin(t * 0.08) * 0.3) + ')';
      ctx.font = '20px Jua, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('클릭 / 터치해서 발사!', W / 2, H / 2 + 80);
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life, 0);
      if (p.heart) drawHeart(p.x, p.y, p.size, p.color);
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.font = '18px Jua, sans-serif'; ctx.textAlign = 'center';
    for (const f of floaters) {
      ctx.globalAlpha = f.life; ctx.fillStyle = '#ff6f9f'; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function loop() {
    if (state === 'play') update();
    if (paddle) draw();
    requestAnimationFrame(loop);
  }
  loadLevel();
  loop();
})();
</script>
</body>
</html>
